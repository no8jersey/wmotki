<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wmotki</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./theme.css">
  <script src="./gallery-data.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <header class="site-controls">
    <button id="music-toggle" type="button" aria-label="Включить музыку" title="Включить музыку" aria-pressed="false">
      <img class="play-icon" src="./music/play.png"
        width="24" height="24" alt="">
      <img class="stop-icon" src="./music/stop.png"
        width="24" height="24" alt="" hidden>
    </button>
    <select id="language" aria-label="Язык сайта">
      <option value="en">english</option><option value="sr">srpski</option><option value="ru" selected>русский</option>
    </select>
    <span id="music-status" role="status" hidden></span>
  </header>
  <main class="workspace" aria-label="Подбор одежды">
    <div id="gallery" class="gallery" aria-label="Коллекция изображений"></div>
    <button id="compose" class="compose" type="button"
      aria-label="Следующий вариант образа" title="Следующий вариант образа"
      aria-controls="outfit">
      <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
        <path d="M5 16h22M18 7l9 9-9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <section id="outfit" class="outfit" aria-label="Собранный образ" aria-busy="false">
      <canvas id="outfit-canvas" width="900" height="1400" role="img" aria-label="Собранный образ" hidden></canvas>
      <span id="outfit-status" class="sr-only" role="status" aria-live="polite"></span>
    </section>
  </main>
</body>
</html>
